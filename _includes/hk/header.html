<header class="site-header" data-header>
  <div class="wrap header-inner">
    <a class="brand" href="{{ '/' | relative_url }}">{{ site.title }}</a>
    <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav" data-nav-toggle>
      <i class="fas fa-bars" aria-hidden="true"></i><span class="sr-only">Menu</span>
    </button>
    <nav id="site-nav" class="site-nav" aria-label="Main">
      <ul>
        {% for link in site.data.navigation.main %}
        <li><a href="{{ link.url | relative_url }}"{% if page.url == link.url %} aria-current="page"{% endif %}>{{ link.title }}</a></li>
        {% endfor %}
      </ul>
    </nav>
  </div>
</header>
