research:
  - title: "Manufacturing and service systems"
    short: "Manufacturing & service"
    color: "#2563eb"
    image: /images/research/scheduling.svg
    icon: industry
    text: "Production planning, operations scheduling, inventory control and process planning."
    keywords: ["Production planning", "Operations scheduling", "Inventory control", "Process planning"]
    related:
      - { kind: paper, label: "EJOR 2026 · Flow shop scheduling with reworks under overlapped queue time limits", url: "https://doi.org/10.1016/j.ejor.2025.12.048" }
