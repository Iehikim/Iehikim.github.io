# Journal details keyed by `venue_short` in publications.yml.
#   cover: thumbnail shown next to the paper (journals without one get a placeholder)
#   jcr:   Clarivate Journal Citation Reports, one entry per JCR year.
#          A paper shows the JCR of its publication year; papers newer than
#          `jcr_latest` (and papers under review) show the `jcr_latest` entry.
#          Quartile, rank and top % refer to the journal's best-ranked category
#          that year. top = rank / journals in category x 100.
#          Each June, add the new year's entry and bump jcr_latest.
jcr_latest: "2025"
jcr_release: "June 2026 (2025 data)"
EJOR:
  cover: /images/journals/ejor.webp
  jcr:
    - year: "2025"
      if: "7.0"
      quartile: Q1
      rank: "11/109"
      top: "10.1"
      category: "Operations Research & Management Science"
